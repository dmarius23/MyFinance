version: 2
updates:
  # Backend (Maven) — grouped minor/patch bumps weekly; security updates are opened as they arrive.
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      backend-minor-patch:
        update-types: ["minor", "patch"]

  # Frontend (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]

  # Keep the CI action versions current (and patched).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
