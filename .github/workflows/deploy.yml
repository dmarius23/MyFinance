name: Deploy

# Build the backend + frontend images and push them to GHCR, then (after a manual approval on the
# `production` GitHub Environment) SSH to the Hetzner VM and roll the compose stack.
#
# Required repo config (Settings → Secrets and variables → Actions):
#   Secrets:   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
#   Variables: VITE_API_BASE_URL, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY   (public, build-time)
#   Environment `production` with a required reviewer (the manual approval gate).
#
# App config synced into the VM's ./.env by the deploy job below — all must be SECRETS, never
# variables: variables are plaintext and are NOT masked in logs, which on a public repo publishes
# them (this happened twice to GMAIL_CLIENT_SECRET on 2026-10-28).
#   Secrets:   GMAIL_CLIENT_ID, GMAIL_CLIENT_SECRET, GMAIL_REDIRECT_URI,
#              GMAIL_PUBSUB_TOPIC, GMAIL_PUBSUB_AUDIENCE, GMAIL_PUBSUB_SERVICE_ACCOUNT,
#              META_WHATSAPP_APP_SECRET, META_WHATSAPP_WEBHOOK_VERIFY_TOKEN,
#              META_WHATSAPP_APP_ID, META_WHATSAPP_CONFIG_ID, META_WHATSAPP_REDIRECT_URI
#   Variable:  GMAIL_WATCH_RENEWAL_ENABLED (defaults to true; Gmail watches lapse after 7 days)
#
# NOT synced on purpose: MYFINANCE_SECRET_KEY. It is the AES-256-GCM master key for per-tenant
# SMTP/WhatsApp secrets and stays server-owned — pushing a value that differs by one character
# makes every existing encrypted row undecryptable. Keep it in Secrets as a backup copy only.

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# NO workflow-level `concurrency` on purpose. A workflow-level group queues the whole RUN, so a run left
# sitting at the production approval gate starved every later push indefinitely: the newer run reported
# status=pending with ZERO jobs created and an EMPTY pending_deployments list, so there was nothing to
# approve and no visible cause. That silently held back the PR #108 deploy for a day (2026-10-31).
# Serialisation now lives on the jobs themselves, which lets `supersede` below actually run and clear it.

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/myfinance-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/myfinance-frontend

jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    # Newest commit wins: a superseded build is wasted runner time, and letting two finish out of order
    # would leave the `:latest` tags pointing at the older image.
    concurrency:
      group: deploy-build-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs AFTER build and BEFORE the gated deploy, which is the only point where it can see an older run
  # that has reached the gate. Doing this at the start of the run would miss a predecessor still building.
  supersede:
    name: Supersede runs awaiting approval
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel older runs still waiting for approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # ONLY status=waiting (parked at the approval gate). A run that is genuinely mid-deploy is
          # `in_progress` and must never be interrupted — half-applied `docker compose up`/migrations are
          # exactly what `cancel-in-progress: false` on the deploy job protects against; we queue instead.
          gh api --paginate \
            "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?branch=${{ github.ref_name }}&status=waiting&per_page=100" \
            --jq ".workflow_runs[] | select(.id < ${{ github.run_id }}) | .id" > stale.txt || true
          if [ ! -s stale.txt ]; then
            echo "No older run awaiting approval — nothing to supersede."
            exit 0
          fi
          while read -r id; do
            echo "Cancelling run $id: superseded by ${{ github.run_id }} (${{ github.sha }})."
            gh api --method POST "repos/${{ github.repository }}/actions/runs/$id/cancel" || true
          done < stale.txt

  deploy:
    name: Deploy to Hetzner VM
    needs: [build, supersede]
    runs-on: ubuntu-latest
    environment: production      # <- manual approval gate (required reviewer)
    # Two real deploys must never overlap, so this stays `false`. Safe now only because `supersede` above
    # clears predecessors that are merely awaiting approval — otherwise this group is what deadlocked.
    concurrency:
      group: deploy-prod-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # MUST come from `secrets.`, never `vars.`. GMAIL_CLIENT_SECRET leaked in plaintext on this
      # PUBLIC repo TWICE on 2026-10-28, both times because it was stored as a repository VARIABLE:
      #
      #   1. via appleboy/ssh-action, which echoes its `envs:` values and its `script:` body;
      #   2. via this step's own `env:` block — GitHub Actions renders a step's env mapping into
      #      the log. A `run:` step does NOT hide its environment; assuming so was the mistake.
      #
      # The only thing that actually protects the value is GitHub's log masking, and masking
      # applies to Secrets only. There is no safe way to pass a variable-sourced credential:
      # `env:` is echoed, and inlining `${{ vars.X }}` is worse because the script body is echoed
      # too. So the fallback to `vars.` is gone and a variable-only configuration fails the
      # deploy loudly instead of printing the credential.
      - name: Sync credentials to server (secret-sourced only)
        id: sync_secret
        env:
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          META_WHATSAPP_APP_SECRET: ${{ secrets.META_WHATSAPP_APP_SECRET }}
          META_WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${{ secrets.META_WHATSAPP_WEBHOOK_VERIFY_TOKEN }}
          # Presence flags only — never the values. `!= ''` yields a boolean, so a variable-sourced
          # credential can be detected and rejected without ever expanding it into the log.
          GMAIL_CLIENT_SECRET_IN_VARS: ${{ vars.GMAIL_CLIENT_SECRET != '' }}
          META_WHATSAPP_APP_SECRET_IN_VARS: ${{ vars.META_WHATSAPP_APP_SECRET != '' }}
          META_WHATSAPP_WEBHOOK_VERIFY_TOKEN_IN_VARS: ${{ vars.META_WHATSAPP_WEBHOOK_VERIFY_TOKEN != '' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          payload=""
          for key in GMAIL_CLIENT_SECRET META_WHATSAPP_APP_SECRET META_WHATSAPP_WEBHOOK_VERIFY_TOKEN; do
            val="${!key}"
            in_vars_flag="${key}_IN_VARS"
            if [ -z "$val" ] && [ "${!in_vars_flag}" = "true" ]; then
              echo "::error::$key is a repository VARIABLE. Variables are stored in plaintext and" \
                   "are NOT masked in logs — on a public repo that publishes the credential." \
                   "Delete the variable and create a Secret of the same name:" \
                   "gh variable delete $key && gh secret set $key"
              exit 1
            fi
            if [ -z "$val" ]; then
              echo "  $key: not configured — leaving .env untouched"
              continue
            fi
            payload+="${key}=${val}"$'\n'
          done
          if [ -z "$payload" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/dk"
          chmod 600 "$RUNNER_TEMP/dk"
          # Remote reads KEY=value lines from stdin; unset values were skipped above, so a missing
          # secret can never blank a working value on the server.
          result=$(printf '%s' "$payload" | ssh -i "$RUNNER_TEMP/dk" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'set -eu; cd /opt/myfinance; umask 077; touch .env;
             before=$(sha256sum .env | cut -d" " -f1);
             while IFS= read -r line; do
               k=${line%%=*}; v=${line#*=};
               grep -v "^$k=" .env > .env.new || true;
               printf "%s=%s\n" "$k" "$v" >> .env.new;
               chmod 600 .env.new; mv .env.new .env;
             done;
             after=$(sha256sum .env | cut -d" " -f1);
             [ "$before" = "$after" ] && echo unchanged || echo changed')
          rm -f "$RUNNER_TEMP/dk"
          echo "Credentials: $result"
          [ "$result" = "changed" ] && echo "changed=true" >> "$GITHUB_OUTPUT" \
                                    || echo "changed=false" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          # CI-owned app config. Everything else in ./.env stays hand-maintained on the VM;
          # these are synced from GitHub so a re-provisioned box cannot silently lose them
          # (an unset GMAIL_CLIENT_ID makes "Connect Gmail" answer 503).
          #
          # ONLY non-secret values may appear here — this action echoes its `envs:` into the
          # log. The client id and redirect URI are public by nature (both ship in the browser
          # redirect), so they are safe. GMAIL_CLIENT_SECRET is handled in the step above.
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID || vars.GMAIL_CLIENT_ID }}
          GMAIL_REDIRECT_URI: ${{ secrets.GMAIL_REDIRECT_URI || vars.GMAIL_REDIRECT_URI }}
          # Pub/Sub topic path, not a credential, but now stored as a Secret so it is masked too.
          # Blank is valid and means "no push notifications" — the loop below skips blanks.
          GMAIL_PUBSUB_TOPIC: ${{ secrets.GMAIL_PUBSUB_TOPIC || vars.GMAIL_PUBSUB_TOPIC }}
          # Pub/Sub push verification. The audience is the webhook URL on the API host; the service
          # account is the push identity whose OIDC token we pin. Both are required for push to work
          # — the verifier fails closed without them, because the audience alone authenticates
          # nothing (any GCP account can mint a token for any audience).
          GMAIL_PUBSUB_AUDIENCE: ${{ secrets.GMAIL_PUBSUB_AUDIENCE || vars.GMAIL_PUBSUB_AUDIENCE }}
          GMAIL_PUBSUB_SERVICE_ACCOUNT: ${{ secrets.GMAIL_PUBSUB_SERVICE_ACCOUNT || vars.GMAIL_PUBSUB_SERVICE_ACCOUNT }}
          # Gmail watches expire after 7 days; without renewal push silently stops after a week.
          GMAIL_WATCH_RENEWAL_ENABLED: ${{ vars.GMAIL_WATCH_RENEWAL_ENABLED || 'true' }}
          # Meta app/config IDs and the OAuth redirect ship in the browser, so they are public.
          # The app secret and webhook verify token are synced in the step above.
          META_WHATSAPP_APP_ID: ${{ secrets.META_WHATSAPP_APP_ID || vars.META_WHATSAPP_APP_ID }}
          META_WHATSAPP_CONFIG_ID: ${{ secrets.META_WHATSAPP_CONFIG_ID || vars.META_WHATSAPP_CONFIG_ID }}
          META_WHATSAPP_REDIRECT_URI: ${{ secrets.META_WHATSAPP_REDIRECT_URI || vars.META_WHATSAPP_REDIRECT_URI }}
          # Non-secret boolean: did the previous step rewrite the client secret? Used to force a
          # recreate even when nothing else in .env changed.
          SECRET_CHANGED: ${{ steps.sync_secret.outputs.changed }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GMAIL_CLIENT_ID,GMAIL_REDIRECT_URI,GMAIL_PUBSUB_TOPIC,GMAIL_PUBSUB_AUDIENCE,GMAIL_PUBSUB_SERVICE_ACCOUNT,GMAIL_WATCH_RENEWAL_ENABLED,META_WHATSAPP_APP_ID,META_WHATSAPP_CONFIG_ID,META_WHATSAPP_REDIRECT_URI,SECRET_CHANGED
          script: |
            set -euo pipefail
            cd /opt/myfinance
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # ---- Sync CI-owned NON-SECRET config into ./.env ---------------------------
            # Only public values here. GMAIL_CLIENT_SECRET is written by the preceding job step
            # over raw ssh, because this action echoes its envs and script into the log.
            # An unset value is SKIPPED, never written as empty — otherwise a missing variable
            # would silently blank a working value on the server.
            umask 077
            touch .env
            env_before=$(sha256sum .env | cut -d' ' -f1)
            for key in GMAIL_CLIENT_ID GMAIL_REDIRECT_URI GMAIL_PUBSUB_TOPIC \
                       GMAIL_PUBSUB_AUDIENCE GMAIL_PUBSUB_SERVICE_ACCOUNT GMAIL_WATCH_RENEWAL_ENABLED \
                       META_WHATSAPP_APP_ID META_WHATSAPP_CONFIG_ID META_WHATSAPP_REDIRECT_URI; do
              eval "val=\${$key:-}"
              if [ -z "$val" ]; then
                echo "  $key: not configured in GitHub — leaving .env untouched"
                continue
              fi
              grep -v "^${key}=" .env > .env.new || true
              printf '%s=%s\n' "$key" "$val" >> .env.new
              chmod 600 .env.new
              mv .env.new .env
              echo "  $key: synced"
            done
            env_after=$(sha256sum .env | cut -d' ' -f1)

            docker compose -f docker-compose.prod.yml pull
            # env_file is read only when a container is CREATED, so a plain `up -d` will not
            # pick up .env edits when the image is unchanged. Force the two JVM services.
            # SECRET_CHANGED covers the client secret, rewritten before this step ran.
            if [ "$env_before" != "$env_after" ] || [ "${SECRET_CHANGED:-false}" = "true" ]; then
              echo ".env changed — recreating backend + worker so env_file is re-read"
              docker compose -f docker-compose.prod.yml up -d --force-recreate backend worker
            fi
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            # Health check via Caddy (uses API_HOST from ./.env).
            API_HOST=$(grep -E '^API_HOST=' .env | cut -d= -f2-)
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "https://$API_HOST/actuator/health" || true)
              if [ "$code" = "200" ]; then echo "backend healthy"; exit 0; fi
              sleep 5
            done
            echo "health check failed"; docker compose -f docker-compose.prod.yml logs --tail=80 backend; exit 1
