name: Deploy

# Build the backend + frontend images and push them to GHCR, then (after a manual approval on the
# `production` GitHub Environment) SSH to the Hetzner VM and roll the compose stack.
#
# Required repo config (Settings → Secrets and variables → Actions):
#   Secrets:   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
#   Variables: VITE_API_BASE_URL, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY   (public, build-time)
#   Environment `production` with a required reviewer (the manual approval gate).

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/myfinance-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/myfinance-frontend

jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hetzner VM
    needs: build
    runs-on: ubuntu-latest
    environment: production      # <- manual approval gate (required reviewer)
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/myfinance
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            # Health check via Caddy (uses API_HOST from ./.env).
            API_HOST=$(grep -E '^API_HOST=' .env | cut -d= -f2-)
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "https://$API_HOST/actuator/health" || true)
              if [ "$code" = "200" ]; then echo "backend healthy"; exit 0; fi
              sleep 5
            done
            echo "health check failed"; docker compose -f docker-compose.prod.yml logs --tail=80 backend; exit 1
